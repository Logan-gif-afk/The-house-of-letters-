<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The House of Letters</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d0b0c;
    color: #eee7e2;
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    position: relative;
    overflow: hidden;
}

.hero::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(126, 82, 91, 0.12);
    filter: blur(100px);
    border-radius: 50%;
}

.content {
    position: relative;
    max-width: 700px;
    animation: appear 2s ease;
}

.small {
    letter-spacing: 5px;
    text-transform: uppercase;
    font-size: 12px;
    color: #a99599;
    margin-bottom: 35px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(55px, 13vw, 110px);
    font-weight: 400;
    line-height: .9;
    margin-bottom: 35px;
}

.subtitle {
    font-size: 22px;
    font-style: italic;
    color: #c8bfc0;
    line-height: 1.6;
    margin-bottom: 55px;
}

.enter {
    display: inline-block;
    padding: 14px 35px;
    border: 1px solid #66575b;
    color: #eee7e2;
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 12px;
    text-transform: uppercase;
    transition: .4s;
}

.enter:hover {
    background: #eee7e2;
    color: #0d0b0c;
}

footer {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #665f61;
    font-size: 13px;
    letter-spacing: 1px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="content">

        <div class="small">
            A collection of letters
        </div>

        <h1>
            The House<br>
            of Letters
        </h1>

        <p class="subtitle">
            For everything I could not say<br>
            when you were beside me.
        </p>

        <a class="enter" href="#">
            Enter the House
        </a>

    </div>

    <footer>
        Written with devotion.
    </footer>

</section>

</body>
</html>
